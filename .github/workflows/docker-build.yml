name: Docker Build and Publish

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom Docker image tag (optional)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: care-ecosystem/slapd-dcm4chee

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Compute tags/labels once, share across arch jobs ──────────────────
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      short_sha: ${{ steps.vars.outputs.SHORT_SHA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/care-ecosystem/slapd-dcm4chee
            ${{ env.REGISTRY }}/care-ecosystem/radiology-ldap
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=${{ github.ref_name }}-${{ steps.vars.outputs.SHORT_SHA }}
            type=raw,value=${{ github.ref_name }}-${{ github.run_number }}-${{ steps.vars.outputs.SHORT_SHA }}

  # ── Job 2: Build per-arch images, push arch-suffixed staging tags ─────────────
  build-matrix:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-${{ matrix.arch }}-buildx-

      - name: Build and push arch-specific image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/care-ecosystem/slapd-dcm4chee:${{ github.ref_name }}-${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/care-ecosystem/radiology-ldap:${{ github.ref_name }}-${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

  # ── Job 3: Combine arch digests → multi-arch manifest for every final tag ────
  create-manifest:
    name: Create Multi-Arch Manifest
    needs: [prepare, build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          STAGING_TAG="${{ github.ref_name }}-${{ needs.prepare.outputs.short_sha }}"

          echo "${{ needs.prepare.outputs.tags }}" | while IFS= read -r FULL_TAG; do
            [ -z "$FULL_TAG" ] && continue

            IMAGE="${FULL_TAG%%:*}"

            echo "→ Resolving digests for ${IMAGE}:${STAGING_TAG}-amd64 / arm64"

            AMD64_DIGEST=$(docker buildx imagetools inspect \
              "${IMAGE}:${STAGING_TAG}-amd64" \
              --format '{{json .}}' \
              | jq -r '.manifest.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest')

            ARM64_DIGEST=$(docker buildx imagetools inspect \
              "${IMAGE}:${STAGING_TAG}-arm64" \
              --format '{{json .}}' \
              | jq -r '.manifest.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux") | .digest')

            if [ -z "$AMD64_DIGEST" ] || [ -z "$ARM64_DIGEST" ]; then
              echo "❌ Failed to resolve digests for $IMAGE — skipping $FULL_TAG"
              continue
            fi

            echo "   amd64: $AMD64_DIGEST"
            echo "   arm64: $ARM64_DIGEST"

            docker buildx imagetools create \
              --tag "$FULL_TAG" \
              "${IMAGE}@${AMD64_DIGEST}" \
              "${IMAGE}@${ARM64_DIGEST}"

            echo "✅ Pushed manifest: $FULL_TAG"
          done

      - name: Generate build summary
        run: |
          echo "## Docker Image Built Successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/care-ecosystem/slapd-dcm4chee\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/care-ecosystem/radiology-ldap\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ needs.prepare.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.prepare.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
